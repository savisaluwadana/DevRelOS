name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve modules
        run: |
          go mod tidy
          cat go.sum
      - name: Format
        run: gofmt -w services internal
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api/devrelos
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [go, web]
    env:
      DEVRELOS_API_TOKEN: ${{ github.run_id }}
      DEVRELOS_REQUIRE_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config
      - name: Build runtime images
        run: docker compose build api worker web
      - name: Boot complete stack
        run: docker compose up -d
      - name: Smoke test API auth, RBAC and web proxy
        run: |
          api_ready=0
          web_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then api_ready=1; break; fi
            sleep 2
          done
          if [ "$api_ready" -ne 1 ]; then
            echo "API did not become ready"
            exit 1
          fi

          unauth_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/dashboard)
          test "$unauth_status" = "401"
          curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" http://127.0.0.1:8080/api/v1/dashboard >/dev/null

          user_json=$(curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"email":"ci-viewer@example.invalid","displayName":"CI Viewer","status":"active"}' \
            http://127.0.0.1:8080/api/v1/identity/users)
          user_id=$(printf '%s' "$user_json" | jq -r '.id')
          test -n "$user_id"

          curl -fsS -X PUT -H "Authorization: Bearer $DEVRELOS_API_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$user_id\",\"role\":\"viewer\"}" \
            http://127.0.0.1:8080/api/v1/identity/memberships >/dev/null

          key_json=$(curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke key"}' \
            "http://127.0.0.1:8080/api/v1/identity/users/$user_id/api-keys")
          user_token=$(printf '%s' "$key_json" | jq -r '.token')
          test "${user_token#drk_}" != "$user_token"

          curl -fsS -H "Authorization: Bearer $user_token" http://127.0.0.1:8080/api/v1/dashboard >/dev/null
          viewer_write_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $user_token" -H 'Content-Type: application/json' \
            -d '{"name":"Viewer must not create this event"}' http://127.0.0.1:8080/api/v1/events)
          test "$viewer_write_status" = "403"

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then web_ready=1; break; fi
            sleep 2
          done
          if [ "$web_ready" -ne 1 ]; then
            echo "Web did not become reachable"
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/api/devrelos/api/v1/dashboard >/dev/null
      - name: Runtime logs
        if: always()
        run: docker compose logs --no-color --tail=200 || true
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans || true
