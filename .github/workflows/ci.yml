name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve modules
        run: |
          go mod tidy
          cat go.sum
      - name: Format
        run: gofmt -w services internal
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config
      - name: Build runtime images
        run: docker compose build api worker web
      - name: Boot complete stack
        run: docker compose up -d
      - name: Smoke test API and web
        run: |
          api_ready=0
          web_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then api_ready=1; break; fi
            sleep 2
          done
          if [ "$api_ready" -ne 1 ]; then
            echo "API did not become healthy"
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then web_ready=1; break; fi
            sleep 2
          done
          if [ "$web_ready" -ne 1 ]; then
            echo "Web did not become reachable"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/api/v1/dashboard >/dev/null
      - name: Runtime logs
        if: always()
        run: docker compose logs --no-color --tail=200 || true
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans || true
