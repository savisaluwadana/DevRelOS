name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve modules
        run: |
          go mod tidy
          cat go.sum
      - name: Format check
        run: |
          files="$(gofmt -l services internal)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api/devrelos
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [go, web]
    env:
      DEVRELOS_API_TOKEN: ci-operator-${{ github.run_id }}
      DEVRELOS_REQUIRE_AUTH: "true"
      DEVRELOS_WEB_SESSIONS: "true"
      DEVRELOS_SESSION_MAX_AGE_SECONDS: "3600"
      DEVRELOS_SESSION_SECURE_COOKIE: "false"
      DEVRELOS_RATE_LIMIT_RPM: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Generate runtime encryption key
        run: echo "DEVRELOS_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Validate local compose configuration
        run: docker compose config >/dev/null
      - name: Validate production compose configuration
        env:
          DEVRELOS_DOMAIN: devrelos.example.invalid
          POSTGRES_PASSWORD: ci-db-${{ github.run_id }}
        run: docker compose -f docker-compose.production.yml config >/dev/null
      - name: Build runtime images
        run: docker compose build api worker web
      - name: Boot complete stack
        run: docker compose up -d
      - name: Smoke test auth, sessions, secrets, metrics and invitations
        run: |
          set -eu
          api_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then api_ready=1; break; fi
            sleep 2
          done
          test "$api_ready" = "1"

          unauth_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/dashboard)
          test "$unauth_status" = "401"
          metrics_unauth=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)
          test "$metrics_unauth" = "401"
          curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" http://127.0.0.1:8080/metrics | grep -q devrelos_api_requests_total

          migration_count=$(docker compose exec -T postgres psql -U devrelos -d devrelos -Atc "SELECT count(*) FROM schema_migrations WHERE version='000010_outreach_delivery_retries';")
          test "$migration_count" = "1"

          owner_json=$(curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"email":"ci-owner@example.invalid","displayName":"CI Owner","status":"active","role":"owner"}' \
            http://127.0.0.1:8080/api/v1/identity/users)
          owner_id=$(printf '%s' "$owner_json" | jq -r '.id')
          test -n "$owner_id"

          key_json=$(curl -fsS -H "Authorization: Bearer $DEVRELOS_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI browser bootstrap"}' \
            "http://127.0.0.1:8080/api/v1/identity/users/$owner_id/api-keys")
          owner_key=$(printf '%s' "$key_json" | jq -r '.token')
          test "${owner_key#drk_}" != "$owner_key"

          session_json=$(curl -fsS -H "Authorization: Bearer $owner_key" -H 'Content-Type: application/json' \
            -d '{}' http://127.0.0.1:8080/api/v1/identity/sessions)
          session_token=$(printf '%s' "$session_json" | jq -r '.sessionToken')
          test "${session_token#ds_}" != "$session_token"
          curl -fsS -H "Authorization: Bearer $session_token" http://127.0.0.1:8080/api/v1/dashboard >/dev/null

          secret_marker="ci-secret-${GITHUB_RUN_ID}"
          secret_json=$(curl -fsS -H "Authorization: Bearer $session_token" -H 'Content-Type: application/json' \
            -d "{\"provider\":\"github.issues\",\"name\":\"ci-github\",\"value\":\"$secret_marker\"}" \
            http://127.0.0.1:8080/api/v1/secrets)
          secret_id=$(printf '%s' "$secret_json" | jq -r '.id')
          test -n "$secret_id"
          secret_list=$(curl -fsS -H "Authorization: Bearer $session_token" http://127.0.0.1:8080/api/v1/secrets)
          printf '%s' "$secret_list" | grep -q 'ci-github'
          if printf '%s' "$secret_list" | grep -q "$secret_marker"; then echo "plaintext secret leaked"; exit 1; fi
          if printf '%s' "$secret_list" | grep -qi 'ciphertext'; then echo "ciphertext leaked"; exit 1; fi

          invite_json=$(curl -fsS -H "Authorization: Bearer $session_token" -H 'Content-Type: application/json' \
            -d '{"email":"ci-invitee@example.invalid","role":"viewer","expiresHours":1}' \
            http://127.0.0.1:8080/api/v1/identity/invitations)
          invite_token=$(printf '%s' "$invite_json" | jq -r '.inviteToken')
          test "${invite_token#di_}" != "$invite_token"
          accepted_json=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"token\":\"$invite_token\",\"displayName\":\"CI Invitee\"}" \
            http://127.0.0.1:8080/api/v1/identity/invitations/accept)
          invitee_session=$(printf '%s' "$accepted_json" | jq -r '.sessionToken')
          test "${invitee_session#ds_}" != "$invitee_session"
          curl -fsS -H "Authorization: Bearer $invitee_session" http://127.0.0.1:8080/api/v1/dashboard >/dev/null
          viewer_write_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $invitee_session" -H 'Content-Type: application/json' \
            -d '{"name":"Viewer must not create this event"}' http://127.0.0.1:8080/api/v1/events)
          test "$viewer_write_status" = "403"

          web_ready=0
          for i in $(seq 1 60); do
            login_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$login_status" = "200" ]; then web_ready=1; break; fi
            sleep 2
          done
          test "$web_ready" = "1"

          login_json=$(curl -fsS -c /tmp/devrelos.cookies -H 'Content-Type: application/json' \
            -d "{\"token\":\"$owner_key\"}" http://127.0.0.1:3000/api/session/login)
          printf '%s' "$login_json" | grep -q '"ok":true'
          cookie_value=$(awk '$6=="devrelos_user_token" {print $7}' /tmp/devrelos.cookies)
          test "${cookie_value#ds_}" != "$cookie_value"
          test "${cookie_value#drk_}" = "$cookie_value"

          curl -fsS -b /tmp/devrelos.cookies http://127.0.0.1:3000/ >/dev/null
          curl -fsS -b /tmp/devrelos.cookies http://127.0.0.1:3000/api/devrelos/api/v1/dashboard >/dev/null
          curl -fsS -b /tmp/devrelos.cookies http://127.0.0.1:3000/access >/dev/null

          curl -fsS -b /tmp/devrelos.cookies -c /tmp/devrelos.cookies -X POST http://127.0.0.1:3000/api/session/logout >/dev/null
          signed_out_status=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/devrelos.cookies http://127.0.0.1:3000/)
          test "$signed_out_status" = "307"
          revoked_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $session_token" -X DELETE http://127.0.0.1:8080/api/v1/identity/sessions/current)
          test "$revoked_status" = "204"
          post_revoke_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $session_token" http://127.0.0.1:8080/api/v1/dashboard)
          test "$post_revoke_status" = "401"
      - name: Runtime logs
        if: always()
        run: docker compose logs --no-color --tail=250 || true
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans || true
