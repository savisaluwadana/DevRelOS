services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devrelos
      POSTGRES_USER: devrelos
      POSTGRES_PASSWORD: devrelos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devrelos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrelos -d devrelos"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
      DEVRELOS_HTTP_ADDR: :8080
      DEVRELOS_CORS_ORIGIN: http://localhost:3000
      DEVRELOS_API_TOKEN: ${DEVRELOS_API_TOKEN:-}
      DEVRELOS_REQUIRE_AUTH: ${DEVRELOS_REQUIRE_AUTH:-false}
      DEVRELOS_SECRET_KEY: ${DEVRELOS_SECRET_KEY:-}
      DEVRELOS_CLUSTERING_RULES: ${DEVRELOS_CLUSTERING_RULES:-}
      DEVRELOS_RATE_LIMIT_ENABLED: ${DEVRELOS_RATE_LIMIT_ENABLED:-true}
      DEVRELOS_RATE_LIMIT_RPM: ${DEVRELOS_RATE_LIMIT_RPM:-120}
      DEVRELOS_TRUST_PROXY: ${DEVRELOS_TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
      DEVRELOS_WORKER_POLL_INTERVAL: 5s
      DEVRELOS_MEDIA_ROOT: /data/media
      DEVRELOS_MEDIA_OUTPUT_ROOT: /data/media/outputs
      DEVRELOS_SECRET_KEY: ${DEVRELOS_SECRET_KEY:-}
      DEVRELOS_CLUSTERING_RULES: ${DEVRELOS_CLUSTERING_RULES:-}
      DEVRELOS_SMTP_ENABLED: ${DEVRELOS_SMTP_ENABLED:-false}
      DEVRELOS_SMTP_HOST: ${DEVRELOS_SMTP_HOST:-}
      DEVRELOS_SMTP_PORT: ${DEVRELOS_SMTP_PORT:-587}
      DEVRELOS_SMTP_USERNAME: ${DEVRELOS_SMTP_USERNAME:-}
      DEVRELOS_SMTP_PASSWORD: ${DEVRELOS_SMTP_PASSWORD:-}
      DEVRELOS_SMTP_FROM: ${DEVRELOS_SMTP_FROM:-}
      DEVRELOS_SMTP_FROM_NAME: ${DEVRELOS_SMTP_FROM_NAME:-DevRelOS}
      DEVRELOS_SMTP_STARTTLS: ${DEVRELOS_SMTP_STARTTLS:-true}
      DEVRELOS_SMTP_REQUIRE_TLS: ${DEVRELOS_SMTP_REQUIRE_TLS:-true}
      DEVRELOS_OUTREACH_MAX_ATTEMPTS: ${DEVRELOS_OUTREACH_MAX_ATTEMPTS:-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data/media:/data/media
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/devrelos
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEVRELOS_API_URL: http://api:8080
      DEVRELOS_API_TOKEN: ${DEVRELOS_API_TOKEN:-}
      DEVRELOS_WEB_USERNAME: ${DEVRELOS_WEB_USERNAME:-}
      DEVRELOS_WEB_PASSWORD: ${DEVRELOS_WEB_PASSWORD:-}
      DEVRELOS_WEB_SESSIONS: ${DEVRELOS_WEB_SESSIONS:-false}
      DEVRELOS_SESSION_MAX_AGE_SECONDS: ${DEVRELOS_SESSION_MAX_AGE_SECONDS:-28800}
      DEVRELOS_SESSION_SECURE_COOKIE: ${DEVRELOS_SESSION_SECURE_COOKIE:-false}
    ports:
      # Loopback only, matching postgres and api. Publishing on 0.0.0.0 exposed
      # every server-rendered page to the local network, and in the default
      # local config (no token, sessions off) those pages render unauthenticated.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  devrelos-postgres:
