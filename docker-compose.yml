services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devrelos
      POSTGRES_USER: devrelos
      POSTGRES_PASSWORD: devrelos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devrelos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devrelos -d devrelos"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
      DEVRELOS_HTTP_ADDR: :8080
      DEVRELOS_DEFAULT_WORKSPACE: default
      DEVRELOS_DEFAULT_PROJECT: default
      DEVRELOS_CORS_ORIGIN: http://localhost:3000
      DEVRELOS_API_TOKEN: ${DEVRELOS_API_TOKEN:-}
      DEVRELOS_REQUIRE_AUTH: ${DEVRELOS_REQUIRE_AUTH:-false}
      DEVRELOS_BOOTSTRAP_EMAIL: ${DEVRELOS_BOOTSTRAP_EMAIL:-}
      DEVRELOS_BOOTSTRAP_PASSWORD: ${DEVRELOS_BOOTSTRAP_PASSWORD:-}
      DEVRELOS_BOOTSTRAP_NAME: ${DEVRELOS_BOOTSTRAP_NAME:-}
      DEVRELOS_SESSION_TTL: ${DEVRELOS_SESSION_TTL:-12h}
      DEVRELOS_SECURE_COOKIES: ${DEVRELOS_SECURE_COOKIES:-false}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://devrelos:devrelos@postgres:5432/devrelos?sslmode=disable
      DEVRELOS_DEFAULT_WORKSPACE: default
      DEVRELOS_DEFAULT_PROJECT: default
      DEVRELOS_WORKER_POLL_INTERVAL: 5s
      DEVRELOS_MEDIA_ROOT: /data/media
      DEVRELOS_MEDIA_OUTPUT_ROOT: /data/media/outputs
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./data/media:/data/media
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/devrelos
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEVRELOS_API_URL: http://api:8080
      DEVRELOS_API_TOKEN: ${DEVRELOS_API_TOKEN:-}
      DEVRELOS_WEB_USERNAME: ${DEVRELOS_WEB_USERNAME:-}
      DEVRELOS_WEB_PASSWORD: ${DEVRELOS_WEB_PASSWORD:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  devrelos-postgres:
